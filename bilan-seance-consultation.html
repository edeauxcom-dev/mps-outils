<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tableau des bilans de séance – My Partner School</title>
<style>
  :root {
    --blue:       #1a7bc4;
    --blue-dark:  #115a91;
    --blue-light: #e8f3fb;
    --black:      #1a1a1a;
    --grey-dark:  #444;
    --grey-mid:   #777;
    --grey-light: #f5f7fa;
    --border:     #d0dce8;
    --white:      #ffffff;
    --green:      #2e7d32;
    --orange:     #e65100;
    --red:        #c62828;
    --radius:     6px;
    --shadow:     0 2px 12px rgba(26,123,196,.13);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    font-size: 13.5px;
    color: var(--black);
    background: #dde7f0;
    min-height: 100vh;
    padding: 24px 12px 40px;
  }
  .page-wrapper {
    max-width: 1180px;
    margin: 0 auto;
    background: var(--white);
    border-radius: 10px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  header {
    background: linear-gradient(135deg, var(--blue-dark) 0%, var(--blue) 100%);
    padding: 22px 32px 18px;
    display: flex;
    align-items: center;
    gap: 22px;
    flex-wrap: wrap;
  }
  header .logo-zone {
    background: white;
    border-radius: 8px;
    padding: 8px 14px;
    display: flex;
    align-items: center;
    min-width: 160px;
  }
  header .logo-zone img { height: 42px; display: block; }
  header .header-text { flex: 1; min-width: 220px; }
  header .header-text h1 {
    color: white;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: .3px;
    margin-bottom: 3px;
  }
  header .header-text .subtitle {
    color: rgba(255,255,255,.78);
    font-size: 11.5px;
    font-weight: 400;
    letter-spacing: .5px;
    text-transform: uppercase;
  }
  .link-new {
    background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.4);
    color: white;
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
  }
  .link-new:hover { background: rgba(255,255,255,.28); }

  .toolbar {
    padding: 16px 32px;
    background: var(--grey-light);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    align-items: flex-end;
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--grey-mid);
    text-transform: uppercase;
    letter-spacing: .4px;
  }
  .field select, .field input[type="text"] {
    border: 1.5px solid var(--border);
    border-radius: 4px;
    padding: 7px 10px;
    font-size: 13px;
    color: var(--black);
    background: var(--white);
    font-family: inherit;
    min-width: 170px;
  }
  .btn-refresh {
    background: var(--blue);
    color: white;
    border: none;
    border-radius: var(--radius);
    padding: 9px 18px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-refresh:hover { background: var(--blue-dark); }
  .count-badge {
    margin-left: auto;
    font-size: 12px;
    color: var(--grey-mid);
    font-weight: 600;
    align-self: center;
  }

  .content { padding: 0; }
  #state-msg { padding: 30px 32px; color: var(--grey-mid); font-size: 13px; text-align: center; }

  .cards { padding: 18px 22px 28px; display: flex; flex-direction: column; gap: 12px; }
  .bilan-card {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .bilan-head {
    background: var(--blue-light);
    padding: 10px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    align-items: center;
  }
  .tag {
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: .3px;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 12px;
    background: var(--blue);
    color: white;
  }
  .tag.format { background: var(--blue-dark); }
  .bilan-head .date-formateur { font-size: 12.5px; font-weight: 600; color: var(--black); }
  .bilan-head .spacer { flex: 1; }
  .ambiance-pill {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 12px;
  }
  .ambiance-pill.stable { background: #e8f5e9; color: var(--green); }
  .ambiance-pill.surveiller { background: #fff3e0; color: var(--orange); }
  .ambiance-pill.problematique { background: #ffebee; color: var(--red); }
  .ambiance-pill.inconnue { background: var(--grey-light); color: var(--grey-mid); }

  .bilan-body {
    padding: 12px 16px 14px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px 20px;
    font-size: 12.5px;
  }
  .bilan-field b {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .3px;
    color: var(--grey-mid);
    margin-bottom: 2px;
  }
  .bilan-field.full { grid-column: 1 / -1; }
  .bilan-field .empty { color: #b9c3cc; font-style: italic; }
  .alert-field b { color: var(--red); }

  footer.note {
    text-align: center;
    font-size: 11px;
    color: var(--grey-mid);
    padding: 10px 20px 22px;
  }
</style>
</head>

    <div class="header-text">
      <h1>Tableau des bilans de séance</h1>
      <div class="subtitle">Vue partagée — tous les formateurs et l'équipe pédagogique</div>
    </div>
    <a class="link-new" href="bilan-seance-form.html">+ Nouveau bilan</a>
  </header>

  <div class="toolbar">
    <div class="field">
      <label>Titre / Promo</label>
      <select id="filterTitre">
        <option value="">Tous</option>
        <option>NTC</option>
        <option>CC</option>
        <option>CV</option>
        <option>MEM</option>
      </select>
    </div>
    <div class="field">
      <label>Formateur</label>
      <input type="text" id="filterFormateur" placeholder="Rechercher un nom…"/>
    </div>
    <button class="btn-refresh" onclick="chargerBilans()">🔄 Actualiser</button>
    <div class="count-badge" id="countBadge"></div>
  </div>

  <div class="content">
    <div id="state-msg">Chargement des bilans…</div>
    <div class="cards" id="cards" style="display:none;"></div>
  </div>

  <footer class="note">My Partner School — Trace pédagogique interne · Qualiopi indicateur suivi individualisé</footer>
</div>

<script>
  // Colle ici la MÊME URL Apps Script que dans bilan-seance-form.html
  const API_URL = "https://script.google.com/macros/s/AKfycbyrf4-RNWhJTd2B49y3FTVQdymSOxkbT9HIBneQmbOCgctxhwbrDiJPuB-1gZ9zYgHQ/exec";

  let allBilans = [];

  function ambianceClass(val) {
    if (val === 'Stable') return 'stable';
    if (val === 'À surveiller') return 'surveiller';
    if (val === 'Problématique') return 'problematique';
    return 'inconnue';
  }

  function esc(s) {
    if (!s) return '';
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function fieldHtml(label, value, full, isAlert) {
    const cls = 'bilan-field' + (full ? ' full' : '') + (isAlert ? ' alert-field' : '');
    const content = value ? esc(value).replace(/\n/g, '<br>') : '<span class="empty">—</span>';
    return `<div class="${cls}"><b>${label}</b>${content}</div>`;
  }

  function renderCards() {
    const titreFilter = document.getElementById('filterTitre').value;
    const formateurFilter = document.getElementById('filterFormateur').value.trim().toLowerCase();

    const filtered = allBilans.filter(b => {
      if (titreFilter && b['Titre / Promo'] !== titreFilter) return false;
      if (formateurFilter && !(b['Formateur'] || '').toLowerCase().includes(formateurFilter)) return false;
      return true;
    });

    document.getElementById('countBadge').textContent = filtered.length + ' bilan(s)';

    const cardsEl = document.getElementById('cards');
    if (filtered.length === 0) {
      cardsEl.innerHTML = '<p style="padding:20px;color:var(--grey-mid);">Aucun bilan pour ces critères.</p>';
      return;
    }

    cardsEl.innerHTML = filtered.map(b => {
      const dateAffichee = b['Date de la séance'] || '';
      const amb = ambianceClass(b['Ambiance du groupe']);
      const ambLabel = b['Ambiance du groupe'] || 'Non renseignée';
      return `
        <div class="bilan-card">
          <div class="bilan-head">
            <span class="tag">${esc(b['Titre / Promo'] || '—')}</span>
            <span class="tag format">${esc(b['Format'] || '—')}</span>
            <span class="date-formateur">${esc(dateAffichee)} — ${esc(b['Formateur'] || '—')}</span>
            <span class="spacer"></span>
            <span class="ambiance-pill ${amb}">${esc(ambLabel)}</span>
          </div>
          <div class="bilan-body">
            ${fieldHtml('Séance / Projet', b['Séance / Projet'])}
            ${fieldHtml('Avancement', b['Avancement vs planning'])}
            ${fieldHtml('Absences du jour', b['Absences du jour'])}
            ${fieldHtml('Contenu vu', b['Contenu vu'], true)}
            ${fieldHtml('Points forts', b['Points forts'])}
            ${fieldHtml('Points de blocage', b['Points de blocage'])}
            ${fieldHtml('Alertes individuelles', b['Alertes individuelles'], true, true)}
            ${fieldHtml('Vigilance / actions pour la suite', b['Vigilance / actions pour la suite'], true)}
          </div>
        </div>
      `;
    }).join('');
  }

  async function chargerBilans() {
    if (API_URL.indexOf('COLLE_ICI') !== -1) {
      document.getElementById('state-msg').textContent = "L'outil n'est pas encore connecté à Google Sheets — voir les instructions d'installation.";
      return;
    }
    document.getElementById('state-msg').style.display = 'block';
    document.getElementById('state-msg').textContent = 'Chargement des bilans…';
    document.getElementById('cards').style.display = 'none';
    try {
      const res = await fetch(API_URL);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Erreur inconnue');
      allBilans = data.data || [];
      document.getElementById('state-msg').style.display = 'none';
      document.getElementById('cards').style.display = 'flex';
      renderCards();
    } catch (err) {
      document.getElementById('state-msg').textContent = 'Impossible de charger les bilans : ' + err.message;
    }
  }

  document.getElementById('filterTitre').addEventListener('change', renderCards);
  document.getElementById('filterFormateur').addEventListener('input', renderCards);

  chargerBilans();
</script>
</body>
</html>
